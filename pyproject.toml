[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privatefair"
version = "0.1.0"
description = "Privacy-limited adaptive client coordination for fair cross-silo medical-image federated learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Heavy ML stack. CI does NOT install this, so keep core logic importable without torch.
ml = ["torch>=2.2", "torchvision>=0.17", "medmnist>=3.0", "flwr-datasets[vision]>=0.5"]
exp = ["pyyaml>=6", "pandas>=2", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running test, skipped in CI (run locally with: pytest -m slow)",
  "ml: needs the [ml] extras (torch etc.)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
