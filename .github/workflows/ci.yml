name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:  # this job name is what you select as the "required status check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (no heavy ML stack; keep CI fast)
        run: pip install -e ".[dev,exp]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q -m "not slow and not ml"
